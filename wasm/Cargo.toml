[package]
name = "timbrei-dsp-wasm"
version = "0.1.0"
edition = "2021"
description = "Ponte WebAssembly que expõe o DSP verificado do lemi ao frontend Timbrei."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core de referência formalmente verificado (Rust/Lean). Reusado tal e qual:
# este crate é apenas uma casca fina de wasm-bindgen por cima dele.
lemi = { path = "../backend" }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
